<style>
  :root{
    --bg:#ffffff;
    --fg:#111111;
    --muted:#666666;
    --border:#eaeaea;
    --link:#111111;
    --accent:#0070f3;
    --accent-bg:rgba(0,112,243,0.08);
    --accent-2:#f5a623;
    --accent-2-bg:rgba(245,166,35,0.10);
    --max:640px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111111;
      --fg:#f2f2f2;
      --muted:#999999;
      --border:#2a2a2a;
      --link:#f2f2f2;
      --accent:#3291ff;
      --accent-bg:rgba(50,145,255,0.12);
      --accent-2:#ffb84d;
      --accent-2-bg:rgba(255,184,77,0.12);
    }
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"Noto Sans KR",sans-serif;
    font-size:17px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--max);margin:0 auto;padding:64px 24px 96px;}
  a{color:var(--link);text-decoration:underline;text-decoration-color:var(--muted);text-decoration-thickness:1.5px;text-underline-offset:3px;}
  a:hover{text-decoration-color:currentColor;text-decoration-thickness:2px;}
  h1{font-size:22px;font-weight:700;margin:0 0 4px;}
  h2{font-size:17px;font-weight:600;margin:0 0 20px;color:var(--fg);}
  p{margin:0 0 16px;color:var(--fg);}
  .muted{color:var(--muted);}
  .intro p{margin-bottom:14px;}

  nav.top{margin-bottom:48px;font-size:15px;display:flex;gap:16px;flex-wrap:wrap;}
  nav.top a{color:var(--muted);text-decoration:none;}
  nav.top a:hover{color:var(--fg);text-decoration:underline;}
  nav.top a.current{color:var(--fg);font-weight:600;}

  ul.plain{list-style:none;margin:0 0 16px;padding:0;}
  ul.plain li{margin-bottom:6px;color:var(--fg);}
  ul.essays{list-style:none;margin:0 0 16px;padding:0;}
  ul.essays li{margin-bottom:8px;}

  .entry{margin-bottom:32px;}
  .entry:last-child{margin-bottom:0;}
  .entry-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .entry-head strong{font-size:16px;font-weight:600;}
  .entry-head span{color:var(--muted);font-size:14.5px;white-space:nowrap;}
  .entry p{color:var(--muted);font-size:15.5px;margin-bottom:6px;}

  .badge{
    display:inline-block;font-size:11.5px;font-weight:600;
    padding:2px 9px;border-radius:999px;white-space:nowrap;
  }
  .badge-build{color:var(--accent);background:var(--accent-bg);}
  .badge-upgrade{color:var(--accent-2);background:var(--accent-2-bg);}
  .badge-poc{color:#22a06b;background:rgba(34,160,107,0.10);}

  table{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:8px;}
  th{text-align:left;font-weight:700;font-size:13px;color:var(--accent);padding:8px 10px 8px 0;border-bottom:2px solid var(--accent-bg);}
  td{padding:10px 10px 10px 0;border-bottom:1px solid var(--border);color:var(--fg);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:var(--accent-bg);}
  .table-scroll{overflow-x:auto;margin-bottom:32px;}
  .table-scroll:last-child{margin-bottom:0;}
  caption{text-align:left;font-size:13px;color:var(--muted);margin-bottom:8px;caption-side:top;}

  .diagram{border:1px solid var(--border);border-radius:6px;overflow-x:auto;margin:8px 0 32px;background:var(--accent-bg);}
  .diagram svg{display:block;min-width:600px;}

  .next-link{margin-top:64px;padding-top:24px;border-top:1px solid var(--border);}
  .next-link .muted{display:block;font-size:13px;margin-bottom:4px;}
  .next-link a{font-size:16px;font-weight:600;text-decoration:none;}
  .next-link a:hover{text-decoration:underline;}

  footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--border);color:var(--muted);font-size:14px;}
</style>
</head>

  </ul>
